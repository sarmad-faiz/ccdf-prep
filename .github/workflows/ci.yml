name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Content rules
        run: npm run content:validate

      - name: Unit tests
        run: npm test

      - name: No secrets in app code
        run: |
          if grep -rnE "sb_secret_|service_role|SUPABASE_SECRET_KEY" src/; then
            echo "The web app must never reference secret keys." && exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Start Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,realtime,storage-api,edge-runtime,supavisor

      - name: Migrations + content
        run: npm run db:reset

      - name: Database tests
        run: npm run db:test

      - name: Leak check
        run: npm run check:leaks

      - name: Export local Supabase settings for the build
        run: |
          supabase status -o json 2>/dev/null | sed -n '/^{/,$p' | jq -r '
            "NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)",
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\(.PUBLISHABLE_KEY)"' >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
